apiVersion: v1
kind: Namespace
metadata:
  name: prod-app
  labels:
    tier: application
---
apiVersion: v1
kind: Namespace
metadata:
  name: sec-telemetry
  labels:
    tier: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: prod-app
  name: app-developer-role
rules:
- apiGroups: ["", "apps"]
  resources: ["pods", "deployments", "services"]
  verbs: ["get", "list", "watch", "create", "update"]