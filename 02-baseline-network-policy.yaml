apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-and-dns
  namespace: prod-app
spec:
  podSelector:
    matchExpressions:
      - key: quarantine
        operator: NotIn
        values:
          - "true"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    # Allow DNS Resolution to kube-system
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    # Allow outbound HTTP/HTTPS
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP