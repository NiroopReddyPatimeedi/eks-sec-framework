apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-target
  namespace: prod-app
  labels:
    app: web-target
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-target
  template:
    metadata:
      labels:
        app: web-target
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-target-svc
  namespace: prod-app
spec:
  selector:
    app: web-target
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80